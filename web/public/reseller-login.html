<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bayi Girişi · CS Commends</title>
	<meta name="description" content="CS Commends bayi paneli girişi.">
	<meta name="robots" content="noindex, follow">
	<meta name="theme-color" content="#0e0e15">
	<link rel="icon" type="image/jpeg" href="/logo.jpg">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/theme.css">

	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/theme-toc.css?v=1">

	<style>
		body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
		.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
		.bg::before, .bg::after { content: ''; position: absolute; width: 500px; height: 500px; border-radius: 50%; filter: blur(140px); }
		.bg::before { background: rgba(139, 147, 255, 0.18); top: -200px; left: -200px; }
		.bg::after { background: rgba(239, 90, 71, 0.14); bottom: -200px; right: -200px; }

		.wrap { min-height: 100vh; display: flex; flex-direction: column; padding: 1.5rem 1rem; position: relative; z-index: 1; }
		.top-bar { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
		.back-link { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--fg-3); font-size: 0.82rem; text-decoration: none; transition: color var(--t-fast); }
		.back-link:hover { color: var(--fg-1); }

		.login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 0; }

		.card {
			width: 100%;
			max-width: 440px;
			background: var(--bg-2);
			border: 1px solid var(--bd-1);
			border-radius: var(--r-xl);
			padding: 2.25rem;
			box-shadow: var(--shadow-lg);
		}

		.brand { text-align: center; margin-bottom: 1.5rem; }
		.brand .badge {
			display: inline-flex; align-items: center; gap: 0.35rem;
			padding: 0.3rem 0.8rem; border-radius: var(--r-full);
			background: var(--info-soft); color: var(--info);
			font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
			margin-bottom: 0.85rem;
		}
		.brand img { width: 48px; height: 48px; border-radius: 12px; margin: 0 auto 0.6rem; display: block; }
		.brand h1 { font-size: 1.5rem; margin: 0 0 0.3rem; }
		.brand p { color: var(--fg-3); font-size: 0.85rem; margin: 0; }
	</style>
<script src="/js/csrf-helper.js"></script>
</head>
<body>

<div class="bg"></div>

<div class="wrap">
	<div class="top-bar">
		<a href="/" class="back-link">
			<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
			<span>Ana sayfaya dön</span>
		</a>
		<div class="lang-switch">
			<button data-lang-switch="tr" aria-label="Türkçe seç">TR</button>
			<button data-lang-switch="en" aria-label="Select English">EN</button>
			<button data-lang-switch="de" aria-label="Deutsch wählen" title="Deutsch">DE</button>
						<button data-lang-switch="ru" aria-label="Выбрать русский" title="Русский">RU</button>
						<button data-lang-switch="pt" aria-label="Selecionar português" title="Português">PT</button>
						<button data-lang-switch="es" aria-label="Seleccionar español" title="Español">ES</button>
						<button data-lang-switch="fr" aria-label="Sélectionner le français" title="Français">FR</button>
						<button data-lang-switch="pl" aria-label="Wybierz polski" title="Polski">PL</button>
		</div>
	</div>

	<main class="login-main">
		<div class="card">
			<div class="brand">
				<span class="badge">Bayi Paneli</span>
				<img src="/logo.jpg" alt="CS Commends" width="40" height="40">
				<h1>Bayi Girişi</h1>
				<p>Bayi kullanıcı adı ve şifrenle giriş yap</p>
			</div>

			<form id="loginForm" novalidate>
				<label class="label" for="usernameInput">Kullanıcı Adı</label>
				<input type="text" class="input" id="usernameInput" placeholder="bayi_adi" autocomplete="username" spellcheck="false" maxlength="64">

				<label class="label mt-2" for="passwordInput">Şifre</label>
				<input type="password" class="input" id="passwordInput" placeholder="••••••••" autocomplete="current-password" spellcheck="false" maxlength="256">

				<div class="input-error" id="loginError"></div>

				<button type="submit" class="btn btn-primary btn-lg btn-block mt-3" id="loginBtn">
					<span>Giriş Yap</span>
				</button>
			</form>

			<div class="text-center mt-4" style="margin-top: 1.5rem; padding-top: 1.2rem; border-top: 1px solid var(--bd-1);">
				<p class="text-muted fs-sm" style="margin-bottom: 0.6rem;">Henüz bayi değil misin?</p>
				<a href="/bayilik" class="btn btn-secondary btn-sm" style="width: auto; padding: 0.5rem 1rem;">
					💼 Bayilik Paketlerini İncele →
				</a>
				<p class="text-muted fs-sm mt-3" style="margin-top: 1rem;">
					Veya Discord'dan ulaş:
					<a href="https://discord.gg/K4G3RADfbc" target="_blank" rel="noopener">discord.gg/K4G3RADfbc</a>
				</p>
			</div>
		</div>
	</main>
</div>

<script src="/js/i18n.js?v=3"></script>
<script>
(function(){
	const TOKEN_KEY = 'reseller_token';
	const getToken = () => localStorage.getItem(TOKEN_KEY);
	const setToken = (t) => localStorage.setItem(TOKEN_KEY, t);

	if (getToken()) {
		fetch('/api/reseller/me', { headers: { Authorization: 'Bearer ' + getToken() } })
			.then(r => r.ok ? r.json() : null)
			.then(d => { if (d && d.id) location.href = '/reseller'; })
			.catch(() => {});
	}

	const form = document.getElementById('loginForm');
	const userIn = document.getElementById('usernameInput');
	const passIn = document.getElementById('passwordInput');
	const btn = document.getElementById('loginBtn');
	const errBox = document.getElementById('loginError');

	const showErr = (m) => { errBox.textContent = m; errBox.classList.add('show'); };
	const hideErr = () => { errBox.classList.remove('show'); };

	form.addEventListener('submit', async (e) => {
		e.preventDefault();
		hideErr();

		const username = userIn.value.trim();
		const password = passIn.value;
		if (!username) return showErr('Kullanıcı adı gir');
		if (!password) return showErr('Şifre gir');

		btn.disabled = true;
		const origHTML = btn.innerHTML;
		btn.innerHTML = '<span class="spinner"></span><span>Giriş yapılıyor...</span>';

		try {
			const r = await fetch('/api/reseller/login', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ username, password })
			});
			const data = await r.json();
			if (!r.ok) {
				const map = {
					missing_credentials: 'Kullanıcı adı ve şifre gerekli',
					invalid_credentials: 'Kullanıcı adı veya şifre yanlış',
					account_suspended: 'Hesabın askıya alındı. Destek ekibimize ulaş.'
				};
				throw new Error(map[data.error] || data.error || 'Giriş başarısız');
			}
			setToken(data.token);
			btn.innerHTML = '<span>Başarılı</span>';
			btn.style.background = 'linear-gradient(135deg, #4ade80, #22c55e)';
			setTimeout(() => location.href = '/reseller', 400);
		} catch (ex) {
			showErr(ex.message);
			btn.disabled = false;
			btn.innerHTML = origHTML;
		}
	});
})();
</script>

	<script src="/js/tawk.js" defer></script>
	<script src="/js/sale-popup.js?v=4" defer></script>
</body>
</html>
