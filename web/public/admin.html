<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin - CS Commends</title>
	<meta name="robots" content="noindex, nofollow">
	<meta name="theme-color" content="#0c0c11">
	<link rel="icon" type="image/jpeg" href="/logo.jpg">
	<script src="/js/tailwind.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="/css/admin.css?v=1">
<script src="/js/csrf-helper.js"></script>
</head>
<body class="min-h-screen">

	<div id="toast-container" class="fixed top-4 right-4 flex flex-col items-end" style="z-index: 400;"></div>

	<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)window.closeModal&&window.closeModal()">
		<div id="modalContent" class="bg-[#14141c] rounded-2xl border border-[#252530] shadow-2xl max-w-2xl w-full mx-4 max-h-[85vh] overflow-y-auto"></div>
	</div>

	<div id="adminLogin" class="min-h-screen flex items-center justify-center p-4">
		<div class="max-w-sm w-full bg-[#14141c] rounded-2xl shadow-2xl p-8 fade-in border border-[#252530]">
			<div class="text-center mb-6">
				<div class="w-14 h-14 bg-[#c0392b] rounded-2xl flex items-center justify-center mx-auto mb-4">
					<svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
					</svg>
				</div>
				<h2 class="text-2xl font-bold">Yönetici Girişi</h2>
				<p class="text-sm text-gray-500 mt-1">CS Commends Admin Panel</p>
			</div>
			<form id="adminLoginForm">
				<input type="password" id="adminPassInput" placeholder="Yönetici şifresi" class="input mb-4" required autofocus>
				<button type="submit" id="adminLoginBtn" class="btn btn-primary w-full justify-center py-3">Giriş</button>
				<p id="loginError" class="text-red-400 text-xs text-center mt-3 hidden"></p>
			</form>
			<p class="text-center mt-4"><a href="/" class="text-sm text-gray-500 hover:text-gray-300 transition-colors">Ana sayfaya dön</a></p>
		</div>
	</div>

	<div id="adminPanel" class="hidden min-h-screen flex flex-col">
		<nav class="bg-[#14141c] border-b border-[#252530] px-6 py-3 flex items-center justify-between">
			<div class="flex items-center gap-3">
				<div class="w-8 h-8 bg-[#c0392b] rounded-lg flex items-center justify-center">
					<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
					</svg>
				</div>
				<span class="font-bold text-lg">Admin Panel</span>
				<span class="text-xs bg-[#c0392b] px-2 py-0.5 rounded-full">ADMIN</span>
				<span id="maintenanceBadge" class="hidden text-xs bg-yellow-600 px-2 py-0.5 rounded-full">BAKIM MODU</span>
			</div>
			<div class="flex items-center gap-4">
				<div id="liveIndicator" class="flex items-center gap-2 text-xs text-gray-400">
					<span class="live-dot"></span><span>canlı</span>
				</div>
				<div id="headerBotCount" class="text-xs text-gray-400"></div>
				<button id="gamesatisBtn" class="relative text-gray-400 hover:text-white flex items-center gap-1" title="Gamesatis Otomasyonu" aria-label="Gamesatis" style="background:transparent;border:none;cursor:pointer;padding:6px;">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
					<span id="gamesatisStateLabel" class="text-xs hidden">idle</span>
					<span id="gamesatisStateDot" class="w-2 h-2 rounded-full bg-gray-500"></span>
				</button>
				<button id="hitlBellBtn" class="relative text-gray-400 hover:text-white" title="Bekleyen müdahaleler" aria-label="HITL Müdahaleleri" style="background:transparent;border:none;cursor:pointer;padding:6px;">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
					<span id="hitlBadge" class="badge-pending hidden" style="position:absolute;top:-2px;right:-2px;margin:0;"></span>
				</button>
				<a href="/" class="text-sm text-gray-400 hover:text-white">Site</a>
				<button id="logoutBtn" class="btn btn-secondary btn-sm">Çıkış</button>
			</div>
		</nav>

		<div class="flex flex-1 min-h-0">
			<aside class="w-60 bg-[#14141c] border-r border-[#252530] py-4 px-3 overflow-y-auto">
				<nav id="sidebarNav" class="flex flex-col gap-1">
					<button class="nav-btn" data-section="overview">Genel Bakış</button>
					<button class="nav-btn" data-section="transactions">İşlemler</button>
					<button class="nav-btn" data-section="manualOrder">📦 Manuel Sipariş</button>
					<button class="nav-btn" data-section="hesap">🛒 hesap.com.tr</button>
					<button class="nav-btn" data-section="freeCommends">Ücretsiz Övgüler</button>
					<button class="nav-btn" data-section="bots">Bot Havuzu</button>
					<button class="nav-btn" data-section="users">Kullanıcılar</button>
					<button class="nav-btn" data-section="codes">Kodlar</button>
					<button class="nav-btn" data-section="resellers">Bayilikler</button>
					<button class="nav-btn" data-section="ggsel">🛒 GGSel</button>
					<button class="nav-btn" data-section="reviews">⭐ Yorumlar <span id="reviewsPendingBadge" class="badge-pending hidden"></span></button>
					<button class="nav-btn" data-section="promos">Promosyon Kodları</button>
					<button class="nav-btn" data-section="server">Sunucu & Proxy</button>
					<button class="nav-btn" data-section="analytics">Analitik</button>
					<button class="nav-btn" data-section="settings">Ayarlar</button>
					<button class="nav-btn" data-section="audit">Denetim & Güvenlik</button>
				</nav>
			</aside>

			<main id="sectionRoot" class="flex-1 overflow-y-auto p-6">
				<div class="text-gray-500 text-sm">Yükleniyor...</div>
			</main>
		</div>
	</div>

	<script src="/js/admin.js?v=13"></script>
	<script src="/js/hitl-widget.js?v=6"></script>
	<script src="/js/gamesatis-widget.js?v=2"></script>
</body>
</html>
